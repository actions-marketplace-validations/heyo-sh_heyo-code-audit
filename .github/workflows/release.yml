name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml

  select-mode:
    name: Select release mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select release mode
        id: changesets
        uses: changesets/action/select-mode@v2

  version:
    name: Create or update release pull request
    needs: [verify, select-mode]
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create or update release pull request
        uses: changesets/action/version@v2
        with:
          github-token: ${{ github.token }}
          script: bun run version-packages

  publish:
    name: Tag action and create GitHub Release
    needs: [verify, select-mode]
    if: needs.select-mode.outputs.mode != 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Tag the released action
        env:
          GH_TOKEN: ${{ github.token }}
          HEYO_RELEASE_DRAFT: ${{ vars.HEYO_RELEASE_DRAFT }}
        run: bun run release:action
