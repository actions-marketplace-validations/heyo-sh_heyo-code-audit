name: E2E

on:
  pull_request:
    branches: [main]
    paths:
      - ".e2e/**"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: e2e-code-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'e2e/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit this pull request with the local Action
        id: audit
        uses: ./
        with:
          provider: openai
          model: gpt-5.6-terra
          auth-type: api-key
          auth-token: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ github.token }}
          fail-on: never
          comment-on-clean: "true"

      - name: Verify published Check and review
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.audit.outputs.outcome }}
          CONCLUSION: ${{ steps.audit.outputs.conclusion }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = "published"
          test "$CONCLUSION" = "success"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
            --jq '.check_runs[] | select(.name == "Heyo Code Audit") | .conclusion' \
            | grep -qx "success"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "COMMENTED") | .id' \
            | grep -q .
