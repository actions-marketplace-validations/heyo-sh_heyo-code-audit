name: Heyo Code Audit
description: Provider-agnostic, verified AI code auditing for pull requests.
author: Heyo
branding:
  icon: shield
  color: purple
inputs:
  provider:
    description: Pi provider identifier used for the audit.
    required: false
    default: openai
  model:
    description: Provider-specific model identifier used for the audit.
    required: true
  auth-type:
    description: "Authentication mode: api-key, oauth, aws, or bedrock-bearer."
    required: true
  auth-token:
    description: API key, OAuth access token, or Bedrock bearer token for the selected auth type.
    required: false
  aws-region:
    description: Optional AWS region for amazon-bedrock authentication.
    required: false
  aws-profile:
    description: Optional AWS shared-config profile for amazon-bedrock authentication.
    required: false
  github-token:
    description: GitHub token used only to read PR metadata and publish reports.
    required: true
  checks:
    description: Comma-separated checks to enable.
    required: false
  verification:
    description: Verify every candidate in a separate Pi session.
    required: false
    default: "true"
  report:
    description: "Reporting mode: check, comment, check-and-comment, or none."
    required: false
    default: check-and-comment
  comment-on-clean:
    description: Publish or update the report comment when there are no findings.
    required: false
    default: "false"
  fail-on:
    description: Minimum finding severity that fails the audit.
    required: false
    default: high
  paths:
    description: Comma-separated repository globs to audit.
    required: false
  incremental:
    description: Audit only changes since the last compatible Heyo state.
    required: false
    default: "true"
  max-pr-commits:
    description: Maximum commits for a full audit, or unlimited.
    required: false
    default: "100"
  max-new-commits:
    description: Maximum newly added commits for an incremental audit, or unlimited.
    required: false
    default: "20"
outputs:
  outcome:
    description: published, skipped, stale, or skipped-fork-without-auth-token.
  conclusion:
    description: GitHub Check conclusion when a report was produced.
runs:
  using: node20
  main: dist/action.js
